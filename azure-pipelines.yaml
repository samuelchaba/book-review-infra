trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

variables:
  AWS_REGION: 'ap-south-1'
  AWS_SERVICE_CONNECTION: 'aws-service-connection'

stages:
- stage: Terraform
  displayName: 'Provision AWS Infrastructure'
  jobs:
  - job: Terraform_Apply
    displayName: 'Terraform Init, Plan and Apply'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: AWSShellScript@1
      displayName: 'Terraform Init, Plan and Apply'
      inputs:
        awsCredentials: '$(AWS_SERVICE_CONNECTION)'
        regionName: '$(AWS_REGION)'
        scriptType: 'inline'
        inlineScript: |
          set -e
          cd "$(System.DefaultWorkingDirectory)/terraform"
          export TF_VAR_mysql_admin_password="$(MYSQL_ADMIN_PASSWORD)"
          export TF_VAR_ssh_public_key="$HOME/.ssh/id_rsa.pub"
          terraform init -input=false
          terraform plan -input=false -out=tfplan -var-file="envs/dev.tfvars"
          terraform apply -input=false -auto-approve tfplan
          terraform output
      env:
        MYSQL_ADMIN_PASSWORD: $(MYSQL_ADMIN_PASSWORD)
